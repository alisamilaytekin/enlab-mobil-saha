<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Saha Not & Rapor</title>
    <link rel="manifest" href="manifest.json">
    <script src="vendor/tailwindcss.js"></script>
    <link rel="stylesheet" href="vendor/fontawesome.min.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            inset: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
        }
        #appShell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #pageContent {
            flex: 1 1 0%;
            width: 100%;
            max-width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Official TKM / ENLAB Corporate A4 Report Styles (1:1 Print Output) */
        .tkm-a4-page {
            width: 210mm;
            min-height: 296.5mm;
            height: 296.5mm;
            padding: 6.5mm 10.5mm 6mm 10.5mm;
            box-sizing: border-box;
            background: #ffffff;
            color: #111111;
            font-family: Calibri, 'Segoe UI', Arial, sans-serif;
            font-size: 7.8pt;
            line-height: 1.16;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .tkm-page-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .tkm-block {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 2px;
        }
        .tkm-preview-sheet {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            margin: 0 auto 20px auto;
            border: 1px solid #cbd5e1;
            transform-origin: top center;
        }
        .tkm-header {
            display: grid;
            grid-template-columns: 92px 1fr 78px;
            align-items: center;
            border-bottom: 1.8px solid #000000;
            padding-bottom: 4px;
            margin-bottom: 3px;
            flex-shrink: 0;
        }
        .tkm-sec-title {
            color: #c00000 !important;
            font-size: 8.5pt;
            font-weight: 700;
            margin: 4px 0 2px 0;
            letter-spacing: 0.1px;
            break-after: avoid;
            page-break-after: avoid;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .tkm-sub-bar {
            background-color: #d3d3d3 !important;
            color: #111111 !important;
            font-size: 7.8pt;
            font-weight: 700;
            padding: 2.5px 6px;
            margin: 3px 0 2px 0;
            break-after: avoid;
            page-break-after: avoid;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .tkm-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 7.3pt;
            line-height: 1.15;
            color: #111111;
        }
        .tkm-table th, .tkm-table td {
            border: 1px solid #000000;
            padding: 1.8px 4px;
            vertical-align: middle;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .tkm-legend {
            font-size: 6.9pt;
            color: #111111;
            margin: 1px 0 2px 0;
        }
        .tkm-footer {
            margin-top: auto;
            padding-top: 4px;
            flex-shrink: 0;
        }
        .tkm-footer-disclaimer {
            font-size: 6.4pt;
            line-height: 1.18;
            color: #222222;
            text-align: justify;
            padding-bottom: 3px;
            border-bottom: 1px solid #222222;
        }
        .tkm-footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 7.8pt;
            color: #111111;
            padding-top: 2px;
        }

        @page {
            size: A4 portrait;
            margin: 0mm;
        }
        @media print {
            html, body {
                position: static !important;
                width: 210mm !important;
                height: auto !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                color: #000000 !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            #appShell, .no-print { display: none !important; }
            .print-only { display: block !important; }
            .tkm-a4-page {
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                transform: none !important;
                zoom: 1 !important;
                page-break-after: always;
                break-after: page;
            }
            .tkm-a4-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
        .print-only { display: none; }
    </style>
</head>
<body>

    <div id="appShell" class="no-print">
        <!-- MINIMAL TOP BAR -->
        <header class="bg-slate-900 text-white h-13 shrink-0 flex items-center justify-between px-3.5 py-2.5 border-b border-slate-800 shadow-sm">
            <div onclick="navigateTo('home')" class="flex items-center gap-2 cursor-pointer min-w-0">
                <div class="bg-amber-400 text-slate-950 w-7 h-7 rounded-lg flex items-center justify-center font-black text-sm shrink-0">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <span class="font-bold text-sm tracking-tight truncate">TKM Offline Rapor Kayıt</span>
                <span class="text-[10px] bg-sky-500/20 text-sky-300 border border-sky-500/30 px-1.5 py-0.5 rounded font-mono font-bold shrink-0">v0.3</span>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <span id="lastSavedBadge" class="hidden text-[11px] text-emerald-400 font-medium"></span>
            </div>
        </header>

        <!-- SINGLE LOCKED SCROLL AREA -->
        <main id="pageContent" class="p-3 sm:p-4">
            <!-- Populated by app.js -->
        </main>
    </div>

    <!-- PRINTABLE A4 OFFICIAL REPORT CONTAINER -->
    <div id="printableReportArea" class="print-only bg-white text-black"></div>

    <!-- A4 PDF PREVIEW MODAL -->
    <div id="a4PreviewModal" class="no-print fixed inset-0 bg-slate-950 z-50 hidden flex flex-col overflow-hidden">
        <div class="bg-slate-900 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between gap-2 shrink-0">
            <button onclick="closeA4PreviewModal()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Geri</span>
            </button>
            <div class="flex items-center bg-slate-800 rounded-lg border border-slate-700 p-0.5 text-xs">
                <button onclick="adjustA4PreviewZoom(-0.1)" class="px-2.5 py-1 text-slate-300 font-bold">-</button>
                <button onclick="resetA4PreviewZoom()" class="px-2 py-1 text-sky-400 font-bold text-[11px]">Sığdır</button>
                <button onclick="adjustA4PreviewZoom(0.1)" class="px-2.5 py-1 text-slate-300 font-bold">+</button>
            </div>
            <button onclick="triggerBrowserPrint()" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-black text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-file-pdf"></i>
                <span>PDF Çıktı Al</span>
            </button>
        </div>
        <div id="a4PreviewScrollContainer" class="flex-1 overflow-auto py-3 px-2 bg-slate-800 flex flex-col items-center">
            <div id="a4PreviewPagesContainer" class="origin-top"></div>
        </div>
    </div>

    <!-- SIMPLE MODAL -->
    <div id="appModal" class="no-print fixed inset-0 bg-slate-950/70 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 max-w-lg w-full max-h-[88vh] flex flex-col overflow-hidden">
            <div class="px-4 py-3 bg-slate-900 text-white flex items-center justify-between shrink-0">
                <h3 id="modalTitle" class="font-bold text-sm">İşlem</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modalBody" class="p-4 overflow-y-auto space-y-3 text-sm"></div>
            <div id="modalFooter" class="px-4 py-2.5 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2 shrink-0"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="no-print fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 transform translate-y-24 transition-all duration-200 pointer-events-none border border-slate-700">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Kaydedildi</span>
    </div>

    <script src="offline-data.js"></script>
    <script src="offline-db.js"></script>
    <script src="templates.js"></script>
    <script src="app.js"></script>
</body>
</html>
