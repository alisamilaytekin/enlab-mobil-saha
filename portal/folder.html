<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müşteri Rapor Klasörü - Hızlı Rapor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar portal-chrome">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <div style="min-width:0">
          <div id="hdrBrandTitle" class="brand-title">Müşteri Rapor Klasörü</div>
          <div id="hdrBrandSub" class="brand-sub">Dijital Rapor Teslim Portalı</div>
        </div>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">Rapor Doğrulama</a>
    </div>
  </header>

  <main class="container" style="padding-top:20px; padding-bottom:48px;">
    <div id="loadingState" class="card" style="text-align:center; color:#64748b; font-size:14px;">
      Rapor klasörü yükleniyor...
    </div>

    <div id="errorState" class="card hidden" style="text-align:center; border-color:#fecaca;">
      <h2 style="margin:0 0 8px 0; color:#991b1b; font-size:18px;">Klasör Bulunamadı</h2>
      <p id="errorMsg" style="margin:0 0 16px 0; color:#475569; font-size:13px;"></p>
      <a href="/" class="btn btn-dark">Ana Sayfaya Dön</a>
    </div>

    <div id="pinGate" class="card hidden" style="max-width:420px; margin:24px auto;">
      <div style="text-align:center; margin-bottom:16px;">
        <div style="font-size:28px; margin-bottom:6px;">🔒</div>
        <h2 style="margin:0 0 6px 0; font-size:18px;">Erişim Kodu (PIN) Gerekli</h2>
        <div id="pinCompanyLabel" style="font-size:13px; color:#475569; font-weight:600;"></div>
      </div>
      <form id="pinForm">
        <label class="label" for="pinInput">Size İletilen Erişim Şifresi</label>
        <input id="pinInput" type="password" inputmode="numeric" class="input mono" style="text-align:center; font-size:18px; letter-spacing:4px;" placeholder="••••" required>
        <button id="pinSubmitBtn" type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;">
          Klasörü Aç
        </button>
      </form>
    </div>

    <div id="folderContent" class="hidden" style="display:flex; flex-direction:column; gap:16px;">
      <section class="card">
        <div style="display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:14px;">
          <div>
            <span class="badge badge-info" style="margin-bottom:8px;">Müşteri Rapor Klasörü</span>
            <h1 id="companyTitle" style="margin:0; font-size:22px; letter-spacing:-0.01em;"></h1>
            <div id="companyBranch" style="font-size:13px; color:#475569; margin-top:4px;"></div>
            <div id="companyAddress" style="font-size:12px; color:#64748b; margin-top:2px;"></div>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;" id="folderSummaryBadges"></div>
        </div>
      </section>

      <section class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
          <h2 style="margin:0; font-size:16px;">Raporlar (<span id="reportCount">0</span>)</h2>
          <input id="reportFilterInput" type="text" class="input" style="max-width:260px;" placeholder="Ekipman veya rapor no ara...">
        </div>
        <div id="reportsList" style="display:flex; flex-direction:column; gap:10px;"></div>
      </section>
    </div>
  </main>

  <script src="/portal.js"></script>
  <script>
    const folderSlug = PortalUI.getSlugFromPath('p');
    let allReports = [];

    function renderReportsList(list) {
      const box = document.getElementById('reportsList');
      if (!list.length) {
        box.innerHTML = '<div class="card-muted" style="text-align:center;color:#64748b;font-size:13px;">Henüz bu klasörde yayınlanmış rapor bulunmuyor.</div>';
        return;
      }
      box.innerHTML = list.map(r => {
        const isOk = (r.result_status || 'UYGUN') === 'UYGUN';
        const statusBadge = isOk
          ? '<span class="badge badge-ok">UYGUN</span>'
          : '<span class="badge badge-bad">' + PortalUI.escapeHtml(r.result_status) + '</span>';
        const typeBadge = r.source_type === 'uploaded_pdf'
          ? '<span class="badge badge-warn">Harici PDF</span>'
          : '<span class="badge badge-info">A4 Muayene Raporu</span>';

        const reportUrl = '/r/' + encodeURIComponent(r.share_slug);
        const token = PortalUI.getFolderToken(folderSlug);
        const pdfDirectUrl = r.source_type === 'uploaded_pdf'
          ? '/api/report-file?slug=' + encodeURIComponent(r.share_slug) + '&download=1' + (token ? '&token=' + encodeURIComponent(token) : '')
          : reportUrl + '?autoprint=1';

        return `
          <div class="card-muted" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;">
            <div style="min-width:220px; flex:1;">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <strong style="font-size:15px; color:#0f172a;">${PortalUI.escapeHtml(r.equipment_name)}</strong>
                ${statusBadge}
                ${typeBadge}
              </div>
              <div style="font-size:12px; color:#475569; margin-top:5px;">
                Rapor No: <span class="mono" style="font-weight:700;">${PortalUI.escapeHtml(r.report_no)}</span>
                · Doğrulama: <span class="mono" style="font-weight:700;">${PortalUI.escapeHtml(r.verify_code)}</span>
                ${r.inspection_date ? ' · Tarih: ' + PortalUI.escapeHtml(r.inspection_date) : ''}
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <a href="${reportUrl}" class="btn btn-primary btn-sm">Görüntüle</a>
              <a href="${pdfDirectUrl}" ${r.source_type === 'uploaded_pdf' ? 'download' : ''} class="btn btn-emerald btn-sm">PDF İndir</a>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadFolder() {
      const loadingEl = document.getElementById('loadingState');
      const errorEl = document.getElementById('errorState');
      const pinEl = document.getElementById('pinGate');
      const contentEl = document.getElementById('folderContent');

      if (!folderSlug) {
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        document.getElementById('errorMsg').textContent = 'Geçersiz veya eksik klasör bağlantısı.';
        return;
      }

      try {
        const token = PortalUI.getFolderToken(folderSlug);
        const res = await fetch('/api/folder?slug=' + encodeURIComponent(folderSlug), {
          headers: token ? { 'X-Folder-Token': token } : {}
        });
        const data = await res.json();
        loadingEl.classList.add('hidden');

        if (!res.ok || !data.ok) {
          errorEl.classList.remove('hidden');
          document.getElementById('errorMsg').textContent = data.error || 'Klasör yüklenemedi.';
          return;
        }

        const f = data.folder || {};
        const branding = f.branding_json || {};
        if (branding.companyFullName) {
          document.getElementById('hdrBrandTitle').textContent = branding.companyShortName || branding.companyFullName;
          document.getElementById('hdrBrandSub').textContent = branding.companyFullName;
        }

        if (data.requiresPin) {
          pinEl.classList.remove('hidden');
          document.getElementById('pinCompanyLabel').textContent = f.company_name || '';
          setTimeout(() => document.getElementById('pinInput').focus(), 100);
          return;
        }

        pinEl.classList.add('hidden');
        contentEl.classList.remove('hidden');

        document.getElementById('companyTitle').textContent = f.company_name || 'Müşteri Klasörü';
        document.getElementById('companyBranch').textContent = f.company_branch || '';
        document.getElementById('companyAddress').textContent = f.company_address || '';
        document.title = (f.company_name || 'Müşteri Klasörü') + ' - Rapor Portalı';

        allReports = data.reports || [];
        document.getElementById('reportCount').textContent = String(allReports.length);

        const okCount = allReports.filter(r => (r.result_status || 'UYGUN') === 'UYGUN').length;
        const badCount = allReports.length - okCount;
        document.getElementById('folderSummaryBadges').innerHTML = `
          <span class="badge badge-info">Toplam: ${allReports.length}</span>
          <span class="badge badge-ok">Uygun: ${okCount}</span>
          ${badCount > 0 ? `<span class="badge badge-bad">Kusurlu: ${badCount}</span>` : ''}
        `;

        renderReportsList(allReports);
      } catch (err) {
        loadingEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        document.getElementById('errorMsg').textContent = 'Sunucuya erişilirken hata oluştu.';
      }
    }

    document.getElementById('pinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('pinSubmitBtn');
      if (!pin) return;
      btn.disabled = true;
      btn.textContent = 'Kontrol ediliyor...';
      try {
        const res = await fetch('/api/folder-unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: folderSlug, pin })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          PortalUI.toast(data.error || 'Hatalı PIN!', 'error');
          document.getElementById('pinInput').value = '';
          document.getElementById('pinInput').focus();
          return;
        }
        PortalUI.setFolderToken(folderSlug, data.token);
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('pinGate').classList.add('hidden');
        await loadFolder();
      } catch {
        PortalUI.toast('Bağlantı hatası', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Klasörü Aç';
      }
    });

    document.getElementById('reportFilterInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = allReports.filter(r =>
        (r.equipment_name || '').toLowerCase().includes(q) ||
        (r.report_no || '').toLowerCase().includes(q) ||
        (r.verify_code || '').toLowerCase().includes(q)
      );
      renderReportsList(filtered);
    });

    loadFolder();
  </script>
</body>
</html>
